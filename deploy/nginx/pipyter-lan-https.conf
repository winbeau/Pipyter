map $http_upgrade $pipyter_tls_connection_upgrade {
    default upgrade;
    ''      '';
}

upstream pipyter_tls_autodl {
    server __AUTODL_LAN_ADDRESS__:8765;
    keepalive 32;
}

server {
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    server_name _;

    ssl_certificate /etc/pipyter/tls/fullchain.pem;
    ssl_certificate_key /etc/pipyter/tls/private-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PipyterTLS:10m;
    ssl_session_timeout 1d;

    root /opt/pipyter/web;
    index index.html;
    client_max_body_size 256m;

    location = /runtime-config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /nodes/autodl/api/ {
        rewrite ^/nodes/autodl/api/(.*)$ /api/$1 break;
        proxy_pass http://pipyter_tls_autodl;
        proxy_http_version 1.1;
        proxy_set_header Authorization "Bearer __PIPYTER_RUNTIME_TOKEN__";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pipyter_tls_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_socket_keepalive on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
