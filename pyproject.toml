[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pipyter"
dynamic = ["version"]
description = "AI-native scientific workspace runtime built on Jupyter"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "winbeau" }]
keywords = ["jupyter", "jupyterlab", "notebook", "scientific-computing", "workspace"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Framework :: Jupyter",
  "Framework :: Jupyter :: JupyterLab",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jupyter-client>=8.6,<9",
  "jupyterlab>=4.4,<5",
  "pydantic>=2.8,<3",
  "tomli>=2; python_version < '3.11'",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.3",
  "pytest-cov>=5",
]

[project.scripts]
pipyter = "pipyter.cli.main:main"

[project.urls]
Homepage = "https://github.com/winbeau/Pipyter"
Repository = "https://github.com/winbeau/Pipyter"
Issues = "https://github.com/winbeau/Pipyter/issues"

[tool.hatch.version]
path = "src/pipyter/_version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/packages/protocol/schemas",
  "/README.md",
  "/LICENSE",
  "/UPSTREAM.md",
]

[tool.hatch.build.targets.sdist.force-include]
"src/pipyter/static" = "src/pipyter/static"

[tool.hatch.build.targets.wheel]
packages = ["src/pipyter"]

[tool.hatch.build.targets.wheel.force-include]
"packages/protocol/schemas" = "pipyter/protocol/schemas"
"src/pipyter/static" = "pipyter/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
