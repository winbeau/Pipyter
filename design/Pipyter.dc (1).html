<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="theme-color" content="#f7f6f3">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  a{color:#2383e2;text-decoration:none;}
  a:hover{color:#0d47a1;}
  ::selection{background:#d7e9fb;}
  @keyframes pulse-dot{0%,100%{opacity:1;}50%{opacity:.35;}}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</helmet>
<div style="position:fixed;inset:0;overflow:auto;background:#f7f6f3;">
<div style="display:flex;flex-direction:row;min-width:1440px;height:100vh;font-family:Inter,system-ui,sans-serif;--bg:#f7f6f3;--surface:#fff;--surface-2:#f1f1ef;--border:#edece9;--text:#37352f;--text-2:#787774;--text-3:#9b9a97;--accent:#2383e2;--accent-soft:#e3f2fd;--accent-dark:#0d47a1;--pigent:#d9730d;--pigent-soft:#fff0e5;--pigent-dark:#a64b18;background:var(--bg);color:var(--text);">

  <div style="width:84px;flex-shrink:0;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;align-items:center;padding:16px 0 18px;">
    <div style="width:30px;height:30px;border-radius:8px;background:var(--text);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;cursor:pointer;" onClick="{{ goHome }}">P</div>
    <div style="display:flex;flex-direction:column;gap:2px;margin-top:22px;width:100%;padding:0 8px;">
      <div style="{{ navHomeStyle }}" onClick="{{ goHome }}">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span style="font-size:10px;font-weight:500;line-height:1;">Home</span>
      </div>
      <div style="{{ navWorkspaceStyle }}" onClick="{{ goWorkspace }}">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
        <span style="font-size:10px;font-weight:500;line-height:1;">Workspace</span>
      </div>
      <div style="{{ navFiguresStyle }}" onClick="{{ goFigures }}">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m7 14 3-3.5 2.5 2.5 4-5"/></svg>
        <span style="font-size:10px;font-weight:500;line-height:1;">Figures</span>
      </div>
      <div style="{{ navPigentStyle }}" onClick="{{ goPigent }}">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.341 6.484A10 10 0 0 1 10.266 21.85"/><path d="M3.659 17.516A10 10 0 0 1 13.74 2.152"/><circle cx="12" cy="12" r="3"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="19" r="2"/></svg>
        <span style="font-size:10px;font-weight:500;line-height:1;">Pigent</span>
      </div>
      <div style="{{ navSettingsStyle }}" onClick="{{ goSettings }}">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M22 12h-3M5 12H2M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1M18.4 18.4l-2.1-2.1M7.7 7.7 5.6 5.6"/></svg>
        <span style="font-size:10px;font-weight:500;line-height:1;">Settings</span>
      </div>
    </div>
    <div style="flex:1;"></div>
    <div style="width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;cursor:pointer;">王</div>
  </div>

  <sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
    <dc-import name="PipyterHome" hint-size="100%,100%" style="flex:1;min-width:0;display:flex;"></dc-import>
  </sc-if>
  <sc-if value="{{ isWorkspace }}" hint-placeholder-val="{{ false }}">
    <dc-import name="PipyterWorkspace" hint-size="100%,100%" style="flex:1;min-width:0;display:flex;"></dc-import>
  </sc-if>
  <sc-if value="{{ isFigures }}" hint-placeholder-val="{{ false }}">
    <dc-import name="PipyterFigures" hint-size="100%,100%" style="flex:1;min-width:0;display:flex;"></dc-import>
  </sc-if>
  <sc-if value="{{ isPigent }}" hint-placeholder-val="{{ false }}">
    <dc-import name="PipyterPigent" hint-size="100%,100%" style="flex:1;min-width:0;display:flex;"></dc-import>
  </sc-if>
  <sc-if value="{{ isSettings }}" hint-placeholder-val="{{ false }}">
    <dc-import name="PipyterSettings" hint-size="100%,100%" style="flex:1;min-width:0;display:flex;"></dc-import>
  </sc-if>

</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { page: 'home' };

  componentDidMount() {
    const routes = { '': 'home', '/': 'home', '/home': 'home', '/workspace': 'workspace', '/figures': 'figures', '/pigent': 'pigent', '/settings': 'settings' };
    this.readHash = () => {
      const p = routes[window.location.hash.slice(1)];
      if (p) this.setState({ page: p });
    };
    this.readHash();
    window.addEventListener('hashchange', this.readHash);
  }
  componentWillUnmount() { window.removeEventListener('hashchange', this.readHash); }

  go(page) {
    const paths = { home: '/', workspace: '/workspace', figures: '/figures', pigent: '/pigent', settings: '/settings' };
    this.setState({ page });
    if (window.location.hash.slice(1) !== paths[page]) window.location.hash = '#' + paths[page];
  }

  navStyle(active) {
    return {
      width: '100%', height: 56, borderRadius: 10, display: 'flex', flexDirection: 'column',
      alignItems: 'center', justifyContent: 'center', gap: 5, cursor: 'pointer',
      background: active ? 'var(--accent-soft)' : 'transparent',
      color: active ? 'var(--accent-dark)' : 'var(--text-2)',
    };
  }

  renderVals() {
    const p = this.state.page;
    return {
      isHome: p === 'home', isWorkspace: p === 'workspace', isFigures: p === 'figures',
      isPigent: p === 'pigent', isSettings: p === 'settings',
      goHome: () => this.go('home'), goWorkspace: () => this.go('workspace'), goFigures: () => this.go('figures'),
      goPigent: () => this.go('pigent'), goSettings: () => this.go('settings'),
      navHomeStyle: this.navStyle(p === 'home'), navWorkspaceStyle: this.navStyle(p === 'workspace'),
      navFiguresStyle: this.navStyle(p === 'figures'), navPigentStyle: this.navStyle(p === 'pigent'),
      navSettingsStyle: this.navStyle(p === 'settings'),
    };
  }
}
</script>
</body>
</html>
